<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Release Announcement — vertical (1080×1920)</title>
    <link rel="stylesheet" href="theme.css" />
    <script src="props.js"></script>
  </head>
  <body>
    <div data-hf-id="hf-s3gx" id="stage" data-composition-id="release-announcement" data-width="1080" data-height="1920" data-start="0" data-duration="10" data-fps="30">
      <!-- Scan line: thin hairline + travelling accent marker. The one
           continuous ambient motion so the frame never goes fully static.
           It sits 48px inside the platform band's top (y 168), below the
           status and search bar the app draws over the clip. -->
      <div data-hf-id="hf-785o" id="scan" class="scan clip" data-start="0" data-duration="10" data-track-index="0" style="top: 216px;">
        <div data-hf-id="hf-y1vz" class="scan__marker"></div>
      </div>

      <!-- Content anchored in the lower two-thirds of the platform band
           (y 168 to 1330), left-aligned, above the outro. Its right edge
           stops at x 900, clear of the action rail. -->
      <div data-hf-id="hf-i9oc" class="content" style="--content-bottom: 690px; right: 180px;">
        <div data-hf-id="hf-eqb1" id="kicker" class="kicker clip" data-start="0" data-duration="10" data-track-index="1">New release</div>
        <h1 data-hf-id="hf-zrsr" id="headline" class="headline clip" data-start="0.267" data-duration="9.733" data-track-index="2">v0.19.0</h1>
        <p data-hf-id="hf-0j13" id="script" class="script clip" data-start="0.8" data-duration="9.2" data-track-index="3">Ship day. Faster renders, sharper docs, one less thing to babysit.</p>
        <ul data-hf-id="hf-h94v" id="highlights" class="highlights clip" data-start="0" data-duration="10" data-track-index="4">
          <li data-hf-id="hf-84l2" class="highlights__item"><span data-hf-id="hf-6987" class="highlights__tick"></span><span data-hf-id="hf-ychg" class="highlights__text">Fable-mode adopted fleet-wide</span></li>
          <li data-hf-id="hf-6xzu" class="highlights__item"><span data-hf-id="hf-97w7" class="highlights__tick"></span><span data-hf-id="hf-981n" class="highlights__text">FE/UX-UI design bar shipped</span></li>
          <li data-hf-id="hf-7cav" class="highlights__item"><span data-hf-id="hf-8tl6" class="highlights__tick"></span><span data-hf-id="hf-b2ai" class="highlights__text">Feature spotlight goes live on X</span></li>
          <li data-hf-id="hf-vz6w" class="highlights__item" style="display:none"><span data-hf-id="hf-8fa5" class="highlights__tick"></span><span data-hf-id="hf-k82t" class="highlights__text"></span></li>
        </ul>
      </div>

      <!-- The outro sits on the band's bottom margin (y 1330 is 590px up). -->
      <div data-hf-id="hf-d626" id="outro" class="outro clip" data-start="7.667" data-duration="2.333" data-track-index="5" style="bottom: 622px;">roboco.tech</div>
    </div>

    <script>
      // Register the composition timeline metadata. Motion is driven by CSS
      // keyframes (no GSAP — the render is offline, no CDN), but HyperFrames
      // requires the registry entry to consider the composition valid.
      window.__timelines = window.__timelines || {};
      window.__timelines["release-announcement"] = {
        id: "release-announcement",
        duration: 10,
        fps: 30,
        animations: []
      };

      // Read sidecar-supplied props (props.js is overwritten at render time)
      // and populate the DOM. Defensive: a missing prop leaves the placeholder
      // text intact rather than throwing — a missing prop never crashes a render.
      (function () {
        var props = (window.__PROPS__ && typeof window.__PROPS__ === "object") ? window.__PROPS__ : {};

        var version = props.version ? String(props.version) : "";
        if (version && !version.startsWith("v")) version = "v" + version;
        if (version) {
          var headline = document.getElementById("headline");
          if (headline) headline.textContent = version;
        }

        if (typeof props.script === "string" && props.script) {
          var scriptEl = document.getElementById("script");
          if (scriptEl) scriptEl.textContent = props.script;
        }

        var highlights = Array.isArray(props.highlights) ? props.highlights.slice(0, 4) : [];
        var items = document.querySelectorAll(".highlights__item");
        for (var i = 0; i < items.length; i++) {
          var textEl = items[i].querySelector(".highlights__text");
          if (!textEl) continue;
          if (i < highlights.length && highlights[i]) {
            textEl.textContent = String(highlights[i]);
            items[i].style.display = "";
          } else {
            items[i].style.display = "none";
          }
        }
      })();
    </script>
  </body>
</html>
