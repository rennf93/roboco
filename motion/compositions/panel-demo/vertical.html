<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Panel Demo — vertical (1080×1920)</title>
    <link rel="stylesheet" href="../../kit/kit.css" />
    <script src="props.js"></script>
    <script src="../../kit/kit.js"></script>
    <style>
      /* Orientation-specific placement only — component look lives in
         kit.css. Timing is identical between orientations (set inline on
         the elements below); only these positions change with the stage.
         The frame sits in the platform band (kit's pk-band), and the
         toast's right edge stops at x 900 so none of its words sit under
         the action rail. */
      .pk-intake { --pk-intake-top: 24px; }
      .pk-column { --pk-column-top: 200px; }
      .pk-toast { --pk-toast-bottom: 160px; right: 180px; }
      .pk-outro { --pk-outro-bottom: 56px; }
    </style>
  </head>
  <body>
    <div data-hf-id="hf-g448" id="stage" data-composition-id="panel-demo" data-width="1080" data-height="1920" data-start="0" data-duration="12" data-fps="30">
      <div data-hf-id="hf-b9ni" class="pk-band">
        <div data-hf-id="hf-ky0p" class="pk-frame clip" data-start="0" data-duration="12" data-track-index="1">
          <aside data-hf-id="hf-vf6m" class="pk-frame__sidebar">
            <div data-hf-id="hf-7cu8" class="pk-frame__logo"></div>
            <div data-hf-id="hf-f8th" class="pk-frame__navitem"></div>
            <div data-hf-id="hf-x50o" class="pk-frame__navitem pk-frame__navitem--active"></div>
            <div data-hf-id="hf-s2pl" class="pk-frame__navitem"></div>
            <div data-hf-id="hf-t9mo" class="pk-frame__navitem"></div>
            <div data-hf-id="hf-svbn" class="pk-frame__navitem"></div>
          </aside>

          <header data-hf-id="hf-jd7p" class="pk-frame__topbar">
            <div data-hf-id="hf-zsox" class="pk-frame__search">Search tasks, agents...</div>
            <div data-hf-id="hf-d5z4" class="pk-frame__status clip" data-start="0" data-duration="12" data-track-index="0">
              <span data-hf-id="hf-tl8v" class="pk-frame__statusdot"></span>
              <span data-hf-id="hf-zhpv">Live</span>
            </div>
          </header>

          <div data-hf-id="hf-bp68" class="pk-frame__content">
            <!-- Intake: a task title typing out character-by-character. -->
            <div data-hf-id="hf-jc75" class="pk-intake clip" data-start="0" data-duration="12" data-track-index="2" style="animation-delay: 0.4s;">
              <div data-hf-id="hf-sstf" class="pk-intake__label">New task</div>
              <div data-hf-id="hf-kbxq" class="pk-intake__field"><span data-hf-id="hf-xzdt" id="typeTitle">Ship the panel-demo kit</span><span data-hf-id="hf-txmw" class="pk-caret"></span></div>
            </div>

            <!-- Kanban column hosting the task card. -->
            <div data-hf-id="hf-vk0y" class="pk-column">
              <div data-hf-id="hf-7i9n" class="pk-column__header">Tasks</div>
              <div data-hf-id="hf-n9sk" class="pk-card clip" data-start="3.6" data-duration="8.4" data-track-index="3">
                <div data-hf-id="hf-rcf9" class="pk-card__title" id="cardTitle">Ship the panel-demo kit</div>
                <div data-hf-id="hf-rftz" class="pk-card__meta">
                  <span data-hf-id="hf-5wrg" class="pk-chip pk-chip--purple" id="cardTeam">Frontend</span>
                  <span data-hf-id="hf-scdj" class="pk-chip pk-chip--blue" id="cardPriority">P1 - High</span>
                  <span data-hf-id="hf-2qho" class="pk-card__assignee" id="cardAssignee">@fe-dev-1</span>
                </div>
                <div data-hf-id="hf-j9zq" class="pk-card__status">
                  <span data-hf-id="hf-tl2w"
                    class="pk-pill pk-pill--progress pk-pill--swap-out clip"
                    data-start="3.6"
                    data-duration="3.8"
                    data-track-index="4"
                    style="--pk-pill-exit-delay: 3.4s;"
                  >in progress</span>
                  <span data-hf-id="hf-dsg3"
                    class="pk-pill pk-pill--completed pk-pill--swap-in clip"
                    data-start="7.4"
                    data-duration="4.6"
                    data-track-index="5"
                  >completed</span>
                </div>
              </div>
            </div>

            <!-- Cursor glide to the card, then a click pulse on the pill. The
                 ring is its own clip so its click delay counts from its own
                 start: 6s + 1.2s = 7.2s, the click as shipped. -->
            <div data-hf-id="hf-nx9c"
              class="pk-cursor clip"
              data-start="6"
              data-duration="6"
              data-track-index="6"
              style="--pk-cursor-x0: 620px; --pk-cursor-y0: 160px; --pk-cursor-x1: 244px; --pk-cursor-y1: 416px;"
            >
              <div data-hf-id="hf-teu6" class="pk-cursor__glyph"></div>
              <div data-hf-id="hf-oop4" class="pk-cursor__ring clip" data-start="6" data-duration="6" data-track-index="9" style="--pk-click-delay: 1.2s;"></div>
            </div>

            <!-- Toast: the completion notification. -->
            <div data-hf-id="hf-vcan" class="pk-toast clip" data-start="8.6" data-duration="3.4" data-track-index="7">
              <div data-hf-id="hf-p9jw" class="pk-toast__icon"></div>
              <div data-hf-id="hf-d4kz" class="pk-toast__body">
                <div data-hf-id="hf-ywhg" class="pk-toast__title" id="toastTitle">Task completed</div>
                <div data-hf-id="hf-84nb" class="pk-toast__text" id="toastBody">fe-dev-1 merged the panel-demo kit PR.</div>
              </div>
            </div>

            <!-- Outro headline moment. -->
            <div data-hf-id="hf-rrjt" class="pk-outro clip" data-start="10.2" data-duration="1.8" data-track-index="8">roboco.tech</div>
          </div>
        </div>
      </div>
    </div>

    <script>
      // Register the composition timeline metadata. Motion is driven by CSS
      // keyframes (no GSAP — the render is offline, no CDN), but HyperFrames
      // requires the registry entry to consider the composition valid.
      window.__timelines = window.__timelines || {};
      window.__timelines["panel-demo"] = {
        id: "panel-demo",
        duration: 12,
        fps: 30,
        animations: []
      };

      // Read sidecar-supplied props (props.js is overwritten at render time)
      // and populate the DOM. Defensive: a missing prop leaves the
      // placeholder text intact rather than throwing.
      (function () {
        var props = (window.__PROPS__ && typeof window.__PROPS__ === "object") ? window.__PROPS__ : {};

        function setText(id, value) {
          if (typeof value !== "string" || !value) return;
          var el = document.getElementById(id);
          if (el) el.textContent = value;
        }

        setText("cardTitle", props.taskTitle);
        setText("cardTeam", props.teamLabel);
        setText("cardPriority", props.priorityLabel);
        setText("toastTitle", props.toastTitle);
        setText("toastBody", props.toastBody);

        if (typeof props.agentName === "string" && props.agentName) {
          var assignee = document.getElementById("cardAssignee");
          if (assignee) assignee.textContent = "@" + props.agentName;
        }

        // The intake field types out the same task title. Populate it from
        // the prop (falling back to the placeholder already in the markup)
        // before splitting it into per-character spans for the reveal.
        var typeEl = document.getElementById("typeTitle");
        if (typeEl) {
          if (typeof props.taskTitle === "string" && props.taskTitle) {
            typeEl.textContent = props.taskTitle;
          }
          window.PanelKit.typeText(typeEl, { delay: 0.6 });
        }
      })();
    </script>
  </body>
</html>
