name: CodeQL Python

on:
  push:
    # master plus fleet task branches: `pull_request`'s synchronize trigger
    # doesn't reliably fire when a revision lands on a PR head via the
    # merge API (see ci.yml for the live-proven receipts); `push` does, so
    # it's the redundant trigger for a required check that must not go
    # ABSENT on a fleet-authored PR revision.
    branches: [master, slave, 'feature/**', 'bug/**', 'chore/**', 'docs/**', 'hotfix/**']
    paths:
      - 'roboco/**'
      - 'agents/**'
      - 'alembic/**'
      - 'scripts/**'
      - 'pyproject.toml'
      - '.github/workflows/code-ql.yml'
  pull_request:
    # Fleet PRs target the dev branch — see ci.yml's pull_request note.
    branches: [master, slave]
    # No `paths:` here: master's ruleset requires the `code-ql` check, and a
    # workflow a paths filter skips never reports it. The job's first step
    # applies the push trigger's paths instead (see ci.yml).
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

# A fleet branch that's also an open PR head can get both a `push` and a
# `pull_request` run for the same commit; cancel the older one instead of
# burning two runners on identical work. `head_ref` (set only for
# pull_request) and `ref_name` (the short branch name, valid for push) both
# resolve to the SAME branch name, so the two event shapes share one group —
# plain `github.ref` would NOT (it's `refs/pull/<n>/merge` for pull_request
# vs `refs/heads/<branch>` for push, so it'd never collapse them).
# Named after the required check, not the workflow, so a branch still on the
# pre-rename definition never cancels this one (see ci.yml).
concurrency:
  group: check-code-ql-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  analyze:
    # Master's ruleset requires a check with exactly this name, and the fleet's
    # PR gate maps it to the scope it analyzes (pr_gate._CODEQL_CHECK_SCOPES).
    name: code-ql
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
            build-mode: none

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          # The base commit (the PR merge commit's first parent) for the
          # paths match below.
          fetch-depth: 2

      - name: Match the PR's files against the push trigger's paths
        id: paths
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          # The push trigger's paths, verbatim (tests/unit/test_required_checks.py
          # keeps the two lists equal).
          PATHS: |
            roboco/**
            agents/**
            alembic/**
            scripts/**
            pyproject.toml
            .github/workflows/code-ql.yml
        run: python3 .github/scripts/required_checks.py match-paths

      - name: Initialize CodeQL
        if: steps.paths.outputs.relevant == 'true'
        uses: github/codeql-action/init@v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Perform CodeQL Analysis
        if: steps.paths.outputs.relevant == 'true'
        uses: github/codeql-action/analyze@v4.39.1
        with:
          category: "/language:${{ matrix.language }}"
