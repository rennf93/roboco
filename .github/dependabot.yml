version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      dependencies:
        patterns:
          - "*"
    allow:
      - dependency-type: "all"

  - package-ecosystem: "npm"
    directory: "/panel"
    schedule:
      interval: "weekly"
    groups:
      dependencies:
        patterns:
          - "*"
    allow:
      - dependency-type: "all"
    ignore:
      # next 16.2.x froze the panel in-browser (the "tab-hostage" bug) —
      # pinned at 16.1.x until a verified-fixed release. eslint-config-next's
      # peer ceiling also holds eslint/typescript majors back; see PR #560.
      - dependency-name: "next"
        versions: ["16.2.x"]
      - dependency-name: "eslint-config-next"
        versions: ["16.2.x"]

  # Exact versions of the npm CLIs the agent-base and orchestrator images
  # install globally (each Dockerfile reads its manifest; nothing installs
  # from these directories). `increase` keeps every pin exact.
  - package-ecosystem: "npm"
    directories:
      - "/docker/npm/agent-base"
      - "/docker/npm/orchestrator"
    schedule:
      interval: "weekly"
    versioning-strategy: "increase"
