version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      dependencies:
        patterns:
          - "*"
    allow:
      - dependency-type: "all"

  - package-ecosystem: "npm"
    directory: "/panel"
    schedule:
      interval: "weekly"
    groups:
      dependencies:
        patterns:
          - "*"
    allow:
      - dependency-type: "all"
    ignore:
      # TypeScript 7: typescript-eslint refuses to run on it ("typescript-eslint
      # does not support TS 7.0", typescript-eslint/typescript-eslint#10940),
      # so `pnpm lint` crashes. Hold the 5.x line until it supports TS 7; see
      # #1204. (The old next/eslint-config-next 16.2.x holds are gone: the
      # panel is on next 16.4.x.)
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # Exact versions of the npm CLIs the agent-base and orchestrator images
  # install globally (each Dockerfile reads its manifest; nothing installs
  # from these directories). `increase` keeps every pin exact.
  - package-ecosystem: "npm"
    directories:
      - "/docker/npm/agent-base"
      - "/docker/npm/orchestrator"
    schedule:
      interval: "weekly"
    versioning-strategy: "increase"
