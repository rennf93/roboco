# Architectural conventions for RoboCo.
#
# This file overlays the auto-derived scan: every consumer (the validator, the
# per-task constraints, the spawn-time ambient block) reads the merged effective
# map, so only project-specific divergences need to live here. Test and docs
# files are never placement-checked (tests/, docs/, the panel's colocated
# __tests__/ dirs, and *.test.* / *.spec.* files); the scan maps the backend
# (roboco/) + frontend (panel/) layers and defaults misplaced-helper to warn, so
# this file is mostly a small set of module declarations plus the rule-level
# policy below.
#
# Posture: BLOCK every boundary the codebase already honors (a model or helper
# in a route, a route in a service, a model/route in a panel component, a hook
# returning JSX — all refused), WARN the boundaries that still carry debt so a
# task is never stranded on pre-existing code.

version: 1
languages:
  - python
  - typescript

modules:
  # --- Backend: roboco/ --------------------------------------------------------
  - path: roboco/models
    purpose: SQLAlchemy + Pydantic data models
    forbidden:
      - route
  - path: roboco/api
    purpose: API package wiring — app, deps, middleware, websocket
    forbidden:
      - model
  - path: roboco/api/routes
    purpose: HTTP routes — thin handlers that delegate to services
    forbidden:
      - model
      - helper
  - path: roboco/api/schemas
    purpose: API request / response schemas
    forbidden:
      - route
  - path: roboco/mcp/schemas
    purpose: MCP tool input / output schemas
    forbidden:
      - route
  - path: roboco/services
    purpose: business logic, DB writes, side effects — the only layer that owns them
    forbidden:
      - route
  - path: roboco/utils
    purpose: shared, side-effect-free helpers
    forbidden:
      - route
      - component

  # --- Frontend: panel/ --------------------------------------------------------
  - path: panel/src/components
    purpose: presentational UI components
    forbidden:
      - model
      - route
  - path: panel/src/hooks
    purpose: React hooks — data fetching + state, no JSX
    forbidden:
      - component
      - model
      - route
  - path: panel/src/store
    purpose: client-side state management
    forbidden:
      - component
      - route
  - path: panel/src/lib/api
    purpose: typed API client
    forbidden:
      - model
  - path: panel/src/lib
    purpose: shared frontend helpers / utilities
    forbidden:
      - route
      - component

rules:
  # Comments are welcome in RoboCo — intent is documented in-code and in
  # docstrings. The rule only nudges (full-line comments are never flagged).
  #
  # Kept at warn, not promoted (Main-PM decision, 2026-08-08): Sentinel's 2026-07-26
  # report flagged 1,446 violations; the count organically dropped to 603 by
  # 2026-08-08 with no enforced sweep. Promoting to block would force a large,
  # low-value cleanup sweep that contradicts the rule's own stated intent
  # above — it's a soft nudge, not a hard gate. Retiring at level: warn
  # permanently is the lower-risk path; level stays warn indefinitely.
  no_inline_comments:
    level: warn
  # RoboCo routes deliberately call db.commit() (get_db auto-commit is unreliable
  # under BaseHTTPMiddleware); explicit commits no longer count as data access.
  # The 2026-10 conventions sweep (#1188) cleared every finding; promoting this
  # to block is a separate decision.
  thin_routes:
    level: warn
  # The 2026-10 conventions sweep (#1188) moved the last inline fetches into
  # hooks, so nothing is flagged; promoting this to block is a separate decision.
  thin_components:
    level: warn
  # Everything else inherits the derived BLOCK level — no models/helpers in
  # routes, no routes in services, no models/routes in panel components, no
  # inline lint/type suppressions (no_lint_suppressions, block since 2026-10:
  # the sweep left one suppression, waived below), etc.

custom: []
# Waiver entries must describe a suppression that exists in the named file at
# the current branch HEAD. When the suppressed code is gone — removed
# upstream, by a fix, or by a rebase revert — its waiver becomes an orphan
# and must be deleted in the same change that removes the suppression; a
# waiver that describes nothing is worse than no waiver, because it keeps
# silenced debt plausible that no longer exists.
waivers:
  - path: roboco/llm/providers/nebius_sandboxes.py
    rule: no_lint_suppressions
    reason: >-
      `# nosec B108` on `_SANDBOX_ARCHIVE_PATH = "/tmp/roboco-ws.tar.gz"`: the
      path is where the Token Factory Sandboxes API drops the uploaded
      workspace archive inside the disposable, single-tenant microVM, so
      bandit's shared-/tmp concern does not apply. It was verified live on
      2026-09-15 (486daea4). Moving it off /tmp needs one more live run to
      prove the API accepts the new path, which the CEO declined on
      2026-10-29; until then the path, and this waiver, stay.

# Declared infrastructure paths: PRs whose changed files match these globs
# require review by the DevOps agent (devops-1) before pr_pass composes.
# Declared explicitly (matching the shipped defaults) so RoboCo's own repo
# exercises the declaration surface it serves to every other project; an
# empty list would opt out of the gate, and omitting the section entirely
# falls back to the shipped defaults.
infra:
  - "Dockerfile*"
  - "docker/**"
  - "compose*.y*ml"
  - ".github/workflows/**"
  - "nginx/**"
  - "deploy/**"
  - "k8s/**"
  - "terraform/**"
  - "argocd/**"
  - ".gitlab-ci.yml"
