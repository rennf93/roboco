allowBuilds:
  esbuild: true
  puppeteer: true
minimumReleaseAgeExclude:
  - '@hyperframes/core@0.8.216'
  - '@hyperframes/engine@0.8.216'
  - '@hyperframes/lint@0.8.216'
  - '@hyperframes/parsers@0.8.216'
  - '@hyperframes/producer@0.8.216'
  - '@hyperframes/studio-server@0.8.216'
overrides:
  # @hyperframes/engine pins undici to exactly 7.25.0, which carries 29
  # advisories; 7.30.1 is the first 7.x release that fixes all of them. The
  # minor bump keeps the 7.x API the engine imports.
  undici: ^7.30.1
