# Upstreams are COLOR-SUFFIXED and live in the ONE file a blue-green flip
# touches (front/active-upstreams.conf, host-written atomically by
# scripts/deploy-nas.sh and mounted read-only via the front/ DIRECTORY - a
# file bind pins the inode and a flipped include never reaches the running
# container, the 2026-09-17 green-flip failure). The include sits INSIDE the
# server block because it now holds `set` directives, not upstream blocks:
# with variables + the Docker resolver below, upstream hostnames resolve at
# REQUEST time, never at config load. nginx therefore cannot crash-loop on
# "host not found in upstream" (the 2026-09-17 blue-deploy outage: an include
# pointing at a not-yet-running color took the whole panel down at startup),
# and a flip is a graceful `nginx -s reload` hot swap, not a restart.

# The dispatcher (ROBOCO_ROLE=dispatcher) runs the same FastAPI app as the
# orchestrator (ROBOCO_ROLE=api), but it is the only process with a live
# AgentOrchestrator fleet (spawn/waiting-agent state) - see
# roboco/runtime/orchestrator.py's role gate on start(). The orchestrator's
# own copies of that in-memory state stay empty. See the routing table below:
# the three dispatcher locations proxy to the active-color dispatcher from
# the include above.

server {
    listen 80;
    server_name _;
    # Docker's embedded DNS. Mandatory for the variable proxy_pass targets
    # from the include: without a resolver nginx rejects variable hostnames,
    # with it each name resolves per request (10s cache) and a container
    # that is momentarily absent yields a 502 for THAT route only, never a
    # dead proxy.
    resolver 127.0.0.11 valid=10s ipv6=off;
    # The flip file: three `set` directives defining $active_panel,
    # $active_orchestrator, $active_dispatcher. Must sit inside the server
    # block (`set` is invalid at http level).
    include /etc/nginx/front/active-upstreams.conf;

    # Health check -> orchestrator (no auth needed)
    location /health {
        proxy_pass http://$active_orchestrator;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Readiness check -> orchestrator
    location /ready {
        proxy_pass http://$active_orchestrator;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ------------------------------------------------------------------
    # Fleet-owning routes -> dispatcher. MUST precede the generic /api/
    # location below: nginx's longest-prefix match already picks these
    # over /api/ on its own, but the order documents the routing table.
    #
    #   /api/orchestrator/    fleet status/spawn/stop/waiting-agent routes
    #                         (roboco/api/routes/orchestrator.py)
    #   /api/secretary/live/  Secretary on-demand chat spawn + SSE relay
    #                         (roboco/api/routes/secretary_live.py; the
    #                         sibling /api/secretary/directives routes stay
    #                         on the generic /api/ location below)
    #   /api/prompter/live/   Intake on-demand chat spawn + SSE relay
    #                         (roboco/api/routes/prompter_live.py)
    #
    # proxy_buffering off + a long read timeout (mirrors /ws/ below) so the
    # /stream SSE endpoints in these prefixes aren't held in nginx's proxy
    # buffer or cut mid-stream; harmless on the plain JSON routes sharing
    # the same prefix.
    # ------------------------------------------------------------------
    location /api/orchestrator/ {
        proxy_pass http://$active_dispatcher;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Agent-Token "${ROBOCO_PANEL_AGENT_TOKEN}";
        proxy_buffering off;
        proxy_read_timeout 86400;
    }

    location /api/secretary/live/ {
        proxy_pass http://$active_dispatcher;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Agent-Token "${ROBOCO_PANEL_AGENT_TOKEN}";
        proxy_buffering off;
        proxy_read_timeout 86400;
    }

    location /api/prompter/live/ {
        proxy_pass http://$active_dispatcher;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Agent-Token "${ROBOCO_PANEL_AGENT_TOKEN}";
        proxy_buffering off;
        proxy_read_timeout 86400;
    }

    # API requests -> orchestrator
    location /api/ {
        proxy_pass http://$active_orchestrator;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The browser never holds the signing secret. nginx (the only trusted
        # hop for the human panel) attaches the CEO token so secure mode
        # (ROBOCO_AGENT_AUTH_REQUIRED=true) does not lock the panel out. Empty
        # when unset, in which case nginx sends no header (dev/header-trust).
        proxy_set_header X-Agent-Token "${ROBOCO_PANEL_AGENT_TOKEN}";
    }

    # WebSocket requests -> orchestrator
    location /ws/ {
        proxy_pass http://$active_orchestrator;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Agent-Token "${ROBOCO_PANEL_AGENT_TOKEN}";
        proxy_read_timeout 86400;
    }

    # Edge honeytrap (Surface N). Classic scanner/probe paths never reach the
    # orchestrator (only /api|/ws|/health|/ready are proxied there), so guard's
    # recon auto-ban can't see them — they would otherwise hit the panel. Drop
    # them here with 444 (close the connection, no response). Anchored to known
    # scanner fingerprints; /.well-known and every real panel/API route are
    # untouched. The /api-path probes that DO reach the app are handled by
    # guard's threat_ban_config recon/sensitive_file/cms_probing categories.
    location ~* "^/(\.env|\.git|\.aws|\.ssh|\.svn|\.hg|wp-login\.php|wp-admin|xmlrpc\.php|phpmyadmin|admin\.php|server-status|actuator|debug/pprof|cgi-bin|vendor/)" {
        return 444;
    }

    # Everything else -> panel
    location / {
        proxy_pass http://$active_panel;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
