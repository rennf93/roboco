# Registry stack (docker-compose.registry.yml, `make quickstart`): one color,
# so the targets are the plain container names. Mounted as /etc/nginx/front
# and included inside deploy/nginx.conf's server block, so `set` directives
# only (an `upstream` block there fails nginx's config test).
set $active_panel roboco-panel:3000;
set $active_orchestrator roboco-orchestrator:8000;
set $active_dispatcher roboco-dispatcher:8000;
