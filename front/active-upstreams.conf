# ACTIVE BLUE-GREEN COLOR: blue (seeded default).
# This file is THE switch: scripts/deploy-nas.sh --color <c> rewrites it for
# the new color and applies it with `nginx -s reload` inside the running
# roboco-nginx container. Included INSIDE deploy/nginx.conf's server block, so
# it holds `set` directives (an `upstream` block there fails nginx's config
# test). Names must match the color-suffixed containers in docker-compose.yaml;
# the registry stack mounts front/registry/ instead.
set $active_panel roboco-panel-blue:3000;
set $active_orchestrator roboco-orchestrator-blue:8000;
set $active_dispatcher roboco-dispatcher-blue:8000;
